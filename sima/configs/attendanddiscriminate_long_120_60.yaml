name: attendanddiscriminate
dataset_name: wear
devices: ['cuda:0']
anno_json: [
  '${NWEAR_DATA}/wear_dataset_annotations/60fps/wear_split_1.json',
  '${NWEAR_DATA}/wear_dataset_annotations/60fps/wear_split_2.json',
  '${NWEAR_DATA}/wear_dataset_annotations/60fps/wear_split_3.json',
  '${NWEAR_DATA}/wear_dataset_annotations/60fps/wear_split_4.json',
  '${NWEAR_DATA}/wear_dataset_annotations/60fps/wear_split_5.json',
  '${NWEAR_DATA}/wear_dataset_annotations/60fps/wear_split_6.json',
  '${NWEAR_DATA}/wear_dataset_annotations/60fps/wear_split_7.json',
  '${NWEAR_DATA}/wear_dataset_annotations/60fps/wear_split_8.json',
  '${NWEAR_DATA}/wear_dataset_annotations/60fps/wear_split_9.json',
  '${NWEAR_DATA}/wear_dataset_annotations/60fps/wear_split_10.json',
  '${NWEAR_DATA}/wear_dataset_annotations/60fps/wear_split_11.json',
  '${NWEAR_DATA}/wear_dataset_annotations/60fps/wear_split_12.json',
  '${NWEAR_DATA}/wear_dataset_annotations/60fps/wear_split_13.json',
  '${NWEAR_DATA}/wear_dataset_annotations/60fps/wear_split_14.json',
  '${NWEAR_DATA}/wear_dataset_annotations/60fps/wear_split_15.json',
  '${NWEAR_DATA}/wear_dataset_annotations/60fps/wear_split_16.json',
  '${NWEAR_DATA}/wear_dataset_annotations/60fps/wear_split_17.json',
  '${NWEAR_DATA}/wear_dataset_annotations/60fps/wear_split_18.json',
]
dataset: {
  sens_folder: ${NWEAR_DATA}/wear_dataset/raw/inertial/50hz,
  input_dim: 12,
  sampling_rate: 50,
  num_classes: 18,
  window_size: 100,
  window_overlap: 50,
  tiou_thresholds: [0.3, 0.4, 0.5, 0.6, 0.7]
}
model: {
  hidden_dim: 1024,
  conv_kernels: 64,
  conv_kernel_size: 21,
  enc_layers: 1,
  enc_is_bidirectional: False,
  dropout: 0.5,
  dropout_rnn: 0.0,
  dropout_cls: 0.5,
  activation: 'ReLU',
  sa_div: 1
}
train_cfg: {
  lr: 0.0001,
  lr_decay: 0.9,
  lr_step: 10,
  epochs: 100,
  weight_decay: 0.000001,
  weight_init: 'xavier_normal',
  weighted_loss: True,
}
loader: {
  batch_size: 100,
}
